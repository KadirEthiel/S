<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#020205"><title>23.09</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020205}body{font-family:Georgia,"Times New Roman",serif;color:#eef2ff;touch-action:none;user-select:none;-webkit-user-select:none}#app{position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,#080d1c,#020205 48%,#000);overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;visibility:hidden;transition:opacity 1s,visibility 1s}.screen.active{opacity:1;visibility:visible}.date{font-size:clamp(58px,13vw,150px);letter-spacing:.08em;font-weight:400;text-shadow:0 0 35px rgba(91,135,255,.2);transition:.8s}.hint{margin-top:20px;font:10px Arial,sans-serif;letter-spacing:.38em;text-transform:uppercase;color:#68708a}.content{width:min(900px,88vw);text-align:center;z-index:4}.phrase{font-size:clamp(30px,5.2vw,70px);line-height:1.08;letter-spacing:-.025em;text-shadow:0 0 30px rgba(70,110,255,.12);opacity:0;transform:translateY(18px);transition:opacity 1.1s,transform 1.1s}.active .phrase{opacity:1;transform:none}.arrow{position:absolute;right:4vw;bottom:6vh;width:48px;height:48px;border:1px solid rgba(170,190,255,.22);border-radius:50%;background:rgba(255,255,255,.02);color:#bfcaff;font:20px Georgia;cursor:pointer;z-index:10;transition:.35s}.arrow:hover{border-color:#7899ff;box-shadow:0 0 30px rgba(70,110,255,.18);transform:translateX(3px)}.heart{width:min(280px,58vw);height:min(245px,50vw);margin:12px auto 0}.message{white-space:pre-line;font-size:clamp(23px,3.6vw,46px);line-height:1.45;max-height:67vh;overflow:hidden}.cursor{display:inline-block;width:1px;height:1em;background:#dce5ff;vertical-align:-.12em;animation:blink 1s infinite}@keyframes blink{50%{opacity:0}}.subdate{font-size:clamp(28px,5vw,66px);line-height:1.2}.small{margin-top:24px;font:11px Arial,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:#68708a}.choices{display:flex;gap:18px;justify-content:center;margin-top:42px}.choice{min-width:112px;padding:14px 26px;border:1px solid rgba(160,185,255,.24);border-radius:999px;background:rgba(255,255,255,.025);color:#e9eeff;font:14px Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:.35s}.choice:hover{border-color:#7899ff;box-shadow:0 0 30px rgba(65,110,255,.16);transform:translateY(-2px)}.final{font-size:clamp(28px,5vw,66px)}@media(max-width:600px){.arrow{right:22px;bottom:25px}.hint{letter-spacing:.25em}.choices{margin-top:32px}}</style></head><body><div id="app"><canvas id="c"></canvas><section class="screen active" id="home"><div class="date">23.09</div><div class="hint">toca aquí</div></section><section class="screen" id="one"><div class="content"><div class="phrase">Hace un año, un 23 de septiembre...</div><div class="heart"></div></div><button class="arrow" data-go="two">›</button></section><section class="screen" id="two"><div class="content"><div class="phrase">Contra todo pronóstico?</div></div><button class="arrow" data-go="three">›</button></section><section class="screen" id="three"><div class="content"><div class="phrase">…</div></div><button class="arrow" data-go="four">›</button></section><section class="screen" id="four"><div class="content"><div class="message" id="msg"></div></div><button class="arrow" data-go="five">›</button></section><section class="screen" id="five"><div class="content"><div class="date subdate">23 de septiembre de 2025&nbsp;&nbsp;→&nbsp;&nbsp;23 de septiembre de 2026</div><div class="small">Una vuelta más?</div><div class="choices"><button class="choice" id="yes">sí</button><button class="choice" id="no">no</button></div></div></section><section class="screen" id="endno"><div class="content"><div class="final">...</div><div class="small">23.09</div></div></section><section class="screen" id="endyes"><div class="content"><div class="final">Entonces...</div><div class="small">Otra vuelta sera <3</div></div></section></div><script>const personal=`LA VERDAD ES QUE\n\nNo se que es lo que pase sinceramente, pero no puedo negar el hecho de que mis sentimientos por ti nunca se han ido. \nComo dije no se que pase pero si pasa contigo pues se que será lindo`;const c=document.getElementById('c'),x=c.getContext('2d');let w,h,d,fs=[],ps=[],started=false;function size(){w=innerWidth;h=innerHeight;d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;c.style.width=w+'px';c.style.height=h+'px';x.setTransform(d,0,0,d,0,0)}addEventListener('resize',size,{passive:true});size();function drawFlower(px,py,s,r,a=1){x.save();x.translate(px,py);x.rotate(r);x.globalAlpha=a;let n=8,o=Math.max(1,s*.055);for(let i=0;i<n;i++){x.save();x.rotate(i*Math.PI*2/n);let g=x.createLinearGradient(0,-s*.05,0,-s);g.addColorStop(0,'#dce8ff');g.addColorStop(.3,'#79a9ff');g.addColorStop(.72,'#3e70e0');g.addColorStop(1,'#223f96');x.beginPath();x.moveTo(0,-s*.13);x.bezierCurveTo(-s*.3,-s*.23,-s*.66,-s*.48,-s*.62,-s*.77);x.bezierCurveTo(-s*.59,-s*.98,-s*.24,-s*1.08,0,-s);x.bezierCurveTo(s*.24,-s*1.08,s*.59,-s*.98,s*.62,-s*.77);x.bezierCurveTo(s*.66,-s*.48,s*.3,-s*.23,0,-s*.13);x.closePath();x.fillStyle=g;x.fill();x.lineWidth=o;x.strokeStyle='#09142f';x.stroke();x.beginPath();x.moveTo(0,-s*.18);x.quadraticCurveTo(-s*.03,-s*.53,0,-s*.88);x.strokeStyle='rgba(235,245,255,.46)';x.lineWidth=Math.max(.7,s*.016);x.stroke();x.beginPath();x.ellipse(-s*.17,-s*.7,s*.09,s*.22,-.35,0,Math.PI*2);x.fillStyle='rgba(240,248,255,.42)';x.fill();x.restore()}x.beginPath();x.arc(0,0,s*.34,0,Math.PI*2);let q=x.createRadialGradient(-s*.1,-s*.1,s*.02,0,0,s*.36);q.addColorStop(0,'#fff');q.addColorStop(.45,'#aac6ff');q.addColorStop(1,'#557de1');x.fillStyle=q;x.fill();x.lineWidth=o*1.15;x.strokeStyle='#09142f';x.stroke();for(let i=0;i<16;i++){let aa=i*2.4,rr=s*(.08+(i%4)*.05);x.beginPath();x.arc(Math.cos(aa)*rr,Math.sin(aa)*rr,s*.016,0,Math.PI*2);x.fillStyle='rgba(35,67,145,.55)';x.fill()}x.restore()}function add(px,py,s,a,r,delay){fs.push({px,py,s,a,r,delay,b:performance.now(),life:3500+Math.random()*1000,rot:Math.random()*6.28,spin:(Math.random()-.5)*3.5})}function boom(){let cx=w/2,cy=h/2,m=Math.hypot(w,h)*.9;for(let i=0;i<230;i++){let a=Math.random()*Math.PI*2,r=Math.pow(Math.random(),.52)*m;add(cx,cy,11+Math.random()*31,a,r,Math.random()*500)}for(let i=0;i<150;i++){let a=Math.random()*Math.PI*2,r=Math.pow(Math.random(),.43)*m*1.08;add(cx,cy,6+Math.random()*15,a,r,250+Math.random()*750)}for(let i=0;i<170;i++){let a=Math.random()*Math.PI*2;ps.push({a,s:1+Math.random()*4,b:performance.now(),life:350+Math.random()*900})}}function screen(id){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='four')type()}function type(){let e=document.getElementById('msg'),i=0;e.innerHTML='';function t(){if(i<personal.length){e.innerHTML=personal.slice(0,i+1).replace(/\n/g,'<br>')+'<span class="cursor"></span>';i++;setTimeout(t,personal[i-1]===' '?18:34)}else e.innerHTML=personal.replace(/\n/g,'<br>')}t()}document.getElementById('home').addEventListener('pointerdown',()=>{if(started)return;started=true;boom();setTimeout(()=>screen('one'),3500)});document.querySelectorAll('.arrow').forEach(e=>e.onclick=()=>screen(e.dataset.go));document.getElementById('yes').onclick=()=>{boom();screen('endyes')};document.getElementById('no').onclick=()=>screen('endno');function heart(){let b=document.querySelector('.heart').getBoundingClientRect();x.save();x.translate(b.left+b.width/2,b.top+b.height/2);let sc=Math.min(b.width,b.height)/310;for(let i=0;i<155;i++){let t=Math.PI*2*i/155,X=16*Math.pow(Math.sin(t),3)*sc*8.5,Y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*sc*8.5;let t2=Math.PI*2*(i+1)/155,X2=16*Math.pow(Math.sin(t2),3)*sc*8.5,Y2=-(13*Math.cos(t2)-5*Math.cos(2*t2)-2*Math.cos(3*t2)-Math.cos(4*t2))*sc*8.5;x.beginPath();x.moveTo(X,Y);x.lineTo(X2,Y2);x.strokeStyle='rgba(82,125,235,.22)';x.lineWidth=1;x.stroke()}x.restore()}function loop(now){x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);heart();for(let i=ps.length-1;i>=0;i--){let p=ps[i],t=Math.min((now-p.b)/p.life,1),e=1-Math.pow(1-t,3);let xx=w/2+Math.cos(p.a)*e*Math.hypot(w,h)*.65,yy=h/2+Math.sin(p.a)*e*Math.hypot(w,h)*.65;x.beginPath();x.arc(xx,yy,p.s*(1-t),0,Math.PI*2);x.fillStyle='rgba(125,165,255,'+(1-t)+')';x.fill();if(t>=1)ps.splice(i,1)}for(let i=fs.length-1;i>=0;i--){let f=fs[i],age=now-f.b;if(age>f.life){fs.splice(i,1);continue}let ac=Math.max(0,age-f.delay),t=Math.min(ac/2300,1),e=1-Math.pow(1-t,3);f.px=w/2+Math.cos(f.a)*f.r*e;f.py=h/2+Math.sin(f.a)*f.r*e;let a=ac<=0?0:Math.min(1,ac/130),fade=age>f.life-550?Math.max(0,(f.life-age)/550):1;drawFlower(f.px,f.py,f.s*(.08+.92*e),f.rot+f.spin*age*.001,a*fade)}requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
